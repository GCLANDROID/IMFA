plugins {
    id 'com.android.application'
}

android {
    namespace 'com.genius.imfa'
    compileSdk 34
    viewBinding.enabled = true
    defaultConfig {
        applicationId "com.genius.imfa"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "2.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //TODO: CircleImageView
    implementation("de.hdodenhof:circleimageview:3.1.0")
    //TODO: Calendar
    implementation 'org.naishadhparmar.zcustomcalendar:zcustomcalendar:1.0.1'
    //TODO: ExpandableLayout
    implementation 'com.github.cachapa:ExpandableLayout:2.9.2'
    //TODO: AdvancedWebView
    implementation 'com.github.delight-im:Android-AdvancedWebView:v3.2.1'
    //TODO: API call
    implementation 'com.amitshekhar.android:jackson-android-networking:1.0.2'

    implementation 'com.github.amanjeetsingh150:ImageZipper:1.3'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.10'

    implementation 'com.google.android.play:core:1.10.3'

    //TODO: App permission
    implementation 'com.karumi:dexter:6.2.3'
    //TODO: CameraX core library
    implementation "androidx.camera:camera-core:1.3.2"
    implementation "androidx.camera:camera-camera2:1.3.2"
    //TODO: CameraX view class
    implementation "androidx.camera:camera-view:1.3.2"
    //TODO: CameraX lifecycle library
    implementation "androidx.camera:camera-lifecycle:1.3.2"

    implementation 'com.github.amanjeetsingh150:ImageZipper:1.3'


    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.4.1'
    implementation 'com.squareup.okio:okio:2.4.3'

    implementation 'com.github.ronghao:AutoScrollTextView:1.0.3'
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.1'

    implementation 'commons-io:commons-io:2.13.0'
    implementation 'com.google.android.gms:play-services-location:17.0.0+'
    implementation 'com.google.android.gms:play-services-auth:15.0.1'
    implementation 'com.google.android.gms:play-services-maps:17.0.0+'
    implementation 'com.google.android.gms:play-services-places:15.0.1'
    implementation 'com.android.volley:volley:1.0.0'
}